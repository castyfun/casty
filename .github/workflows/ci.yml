name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Advisories and dead links arrive without a commit: the audit and the link check run weekly.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # A hang (a suite waiting on a process that never exits) fails in minutes, not six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # corepack provides pnpm only in the next step, so setup-node must not look for it.
          package-manager-cache: false
      - run: corepack enable
      - id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: lychee
      # Builds the one-file client that scripts/tests/binary.bats runs the acceptance list on.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: make check
      # Fails below the thresholds in client/vitest.config.ts.
      - run: pnpm --filter @casty/client test -- --coverage

  # The scripts promise to run on macOS's own bash 3.2: every bats suite runs under /bin/bash.
  bats-macos:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # corepack provides pnpm only in the next step, so setup-node must not look for it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: brew install yq
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: bats under /bin/bash 3.2
        run: |
          PATH="/bin:$PATH" bash --version | head -1
          PATH="/bin:$PATH" make bats

  # Its own job, so a new advisory does not hide whether the code passes its checks.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # corepack provides pnpm only in the next step, so setup-node must not look for it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm audit --audit-level moderate

  links-external:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config docs/lychee.toml --scheme https --scheme http docs/src/content/docs README.md
