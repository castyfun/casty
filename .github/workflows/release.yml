name: release

# A tag v<version> publishes a GitHub release with casty as one file per platform, which
# scripts/2-client.sh downloads and checks against SHA256SUMS. Each file is built where it
# runs: the Linux ones on Linux (arm64 cross-compiled), the macOS one on macOS, and the
# acceptance suite runs on each machine's own binary before anything is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # corepack provides pnpm only in the next step, so setup-node must not look for it.
          package-manager-cache: false
      - run: corepack enable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: node_modules/.bin/bats scripts/tests/binary.bats
      - run: node client/binary.mjs bun-linux-x64 && node client/binary.mjs bun-linux-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            client/release/casty-linux-x64
            client/release/casty-linux-arm64
            client/release/THIRD_PARTY_LICENSES
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # corepack provides pnpm only in the next step, so setup-node must not look for it.
          package-manager-cache: false
      - run: corepack enable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: node_modules/.bin/bats scripts/tests/binary.bats
      - run: node client/binary.mjs bun-darwin-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin
          path: client/release/casty-darwin-arm64
          if-no-files-found: error

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - run: cd release && chmod +x casty-* && sha256sum casty-linux-x64 casty-linux-arm64 casty-darwin-arm64 | tee SHA256SUMS
      # A tag with a dash (v1.2.0-rc1) is a pre-release, which `releases/latest` passes over.
      - run: |
          flags=(--verify-tag --generate-notes)
          case $GITHUB_REF_NAME in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" release/casty-linux-x64 release/casty-linux-arm64 release/casty-darwin-arm64 release/SHA256SUMS LICENSE release/THIRD_PARTY_LICENSES
        env:
          GH_TOKEN: ${{ github.token }}
